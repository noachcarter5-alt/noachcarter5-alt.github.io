<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工登录</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui,sans-serif;
        }
        body{
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:15px;
            position:relative;
        }
        /* 左上角返回按钮样式 */
        .back-home{
            position:absolute;
            top:16px;
            left:16px;
            padding:8px 16px;
            background:#fff;
            border-radius:8px;
            text-decoration:none;
            color:#2b5bcc;
            border:1px solid #dcdfe6;
        }
        .login-box{
            width:100%;
            max-width:360px;
            background:#fff;
            border-radius:12px;
            padding:32px 24px;
        }
        h2{
            text-align:center;
            margin-bottom:24px;
            font-size:22px;
        }
        .input-item{
            margin-bottom:16px;
        }
        label{
            display:block;
            margin-bottom:6px;
            color:#333;
        }
        input{
            width:100%;
            padding:12px;
            border:1px solid #dcdfe6;
            border-radius:8px;
            font-size:16px;
        }
        button{
            width:100%;
            padding:13px;
            border:none;
            background:#2b5bcc;
            color:white;
            border-radius:8px;
            font-size:16px;
        }
        .tip{
            margin-top:16px;
            text-align:center;
            color:#dd3333;
            display:none;
        }
    </style>
</head>
<body>
    <!-- 左上角返回主页按钮，href改成你的主页文件名 -->
    <a class="back-home" href="index.html">← 返回</a>

    <div class="login-box">
        <h2>员工登录</h2>
        <div class="input-item">
            <label>账号</label>
            <input id="userAcc" placeholder="请输入账号">
        </div>
        <div class="input-item">
            <label>密码</label>
            <input id="userPwd" type="password" placeholder="请输入密码">
        </div>
        <button onclick="loginCheck()">登录</button>
        <div class="tip" id="errTip">账号或者密码错误</div>
    </div>

<script>
//预设账号密码
const rightAcc = "T263642";
const rightPwd = "402899676767";

function loginCheck(){
    let acc = document.getElementById("userAcc").value.trim();
    let pwd = document.getElementById("userPwd").value.trim();
    const tipDom = document.getElementById("errTip");
    if(acc === rightAcc && pwd === rightPwd){
        //✅ 修改完成，登录成功跳转 ticwk.html
        location.href = "ticwk.html";
    }else{
        tipDom.style.display="block";
    }
}
</script>
</body>
</html>

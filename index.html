<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请加入</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            padding: 50px 15px 30px;
        }
        /* 顶部滑入提示 */
        .toast{
            position:fixed;
            top:-60px;
            left:50%;
            transform:translateX(-50%);
            background:#222;
            color:#fff;
            padding:12px 24px;
            border-radius:6px;
            transition: top 0.4s ease;
            z-index:99;
        }
        .shturl.cc/{
            top:16px;
        }
        /* ========== 右上角Logo 仅这里修改，其余样式不动 ========== */
        .top-right-logo{
            position: fixed;
            top:20px;
            right:20px;
            z-index:100;
            width:56px;
            pointer-events:none;
        }
        .top-right-logo img{
            width:100%;
            border-radius:8px;
            display:block;
        }
        .top-logo {
            text-align: center;
            padding: 28px 80px 28px 0;
            font-size: 36px;
            font-weight: bold;
            color: #1a2b48;
            letter-spacing: 6px;
            background: #fff;
            border-bottom: 1px solid #e6e9ef;
        }
        @media (max-width: 768px) {
            .top-right-logo{
                width:42px;
                top:12px;
                right:12px;
            }
        }
        /* 下面你原来全部样式，原样保留，没有改动 */

    </style>
</head>
<body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f4f6f8;
            font-family:system-ui, sans-serif;
        }
        .box{text-align:center}
        h2{color:#333;margin-bottom:16px}
        p{color:#666;font-size:18px}
        .num{font-size:48px;color:#2b6cb0;font-weight:bold;display:inline-block;width:60px}
    </style>
</head>
<body>
    <div class="box">
        <h2>正在跳转申请表单...</h2>
        <p><span class="num" id="count">3</span> 秒后自动前往腾讯问卷</p>
    </div>
<script>
// =========替换成你的腾讯问卷完整网址=========
const targetUrl = "https://wj.qq.com/s2/28427600/wtr5/";
let time = 3;
const countDom = document.getElementById("count");

const timer = setInterval(function(){
    time--;
    countDom.innerText = time;
    if(time <= 0){
        clearInterval(timer);
        window.location.href = targetUrl;
    }
},1000);
</script>
</body>
</html>
